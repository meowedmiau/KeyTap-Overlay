name: Build and publish KeyTap Overlay release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tool
        run: python -m pip install -r requirements-build.txt

      - name: Check release tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }

      - name: Build executable and download archive
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name KeyTap-Overlay --icon "assets/keytap.ico" --add-data "data;data" main.pyw
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path @("dist\KeyTap-Overlay.exe", "README.md", "LICENSE") -DestinationPath "dist\KeyTap-Overlay-$version-Windows.zip" -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create "v$version" "dist\KeyTap-Overlay.exe" "dist\KeyTap-Overlay-$version-Windows.zip" --title "KeyTap Overlay v$version" --generate-notes --verify-tag
